# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ciderclub

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_SECRET: build-placeholder
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_SQUARE_APP_ID: ${{ secrets.NEXT_PUBLIC_SQUARE_APP_ID }}
          NEXT_PUBLIC_SQUARE_LOCATION_ID: ${{ secrets.NEXT_PUBLIC_SQUARE_LOCATION_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Assemble standalone deployment package
        run: |
          # Static assets must be copied manually into standalone
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Copy BUILD_ID and all root-level manifests (required by the server)
          cp .next/BUILD_ID .next/standalone/.next/
          for f in .next/*.json; do cp "$f" .next/standalone/.next/ 2>/dev/null || true; done
          # Copy generated Prisma client (not detected by Next.js tracing)
          mkdir -p .next/standalone/node_modules/.prisma
          cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/client
          mkdir -p .next/standalone/node_modules/@prisma
          cp -r node_modules/@prisma/client .next/standalone/node_modules/@prisma/client
          # Include Prisma schema + migrations
          mkdir -p .next/standalone/prisma
          cp prisma/schema.prisma .next/standalone/prisma/
          cp -r prisma/migrations .next/standalone/prisma/migrations

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3381081E08A1481A954EC751472C9E52 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_452F3C34AB4248CD80A2B343EF2C484B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D2648AB5A70242DD92060AFDDE69B509 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ciderclub'
          slot-name: 'Production'
          package: .
